name: List MEGA folder file links

on:
  workflow_dispatch:
    inputs:
      mega_folder_link:
        description: 'Public MEGA folder link'
        required: true
        type: string
      mega_email:
        description: 'Your MEGA account email'
        required: true
        type: string
      mega_password:
        description: 'Your MEGA account password'
        required: true
        type: string

jobs:
  list-links:
    runs-on: ubuntu-latest
    steps:
      - name: Install MEGAcmd
        run: |
          sudo apt-get update 
          sudo apt-get install -y wget lsb-release
          UBUNTU_VERSION=$(lsb_release -rs) 
          wget -P /tmp "https://mega.nz/linux/repo/xUbuntu_${UBUNTU_VERSION}/amd64/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb" 
          sudo apt install -y "/tmp/megacmd-xUbuntu_${UBUNTU_VERSION}_amd64.deb"
      
      - name: Verify MEGAcmd installation
        run: mega-version
      
      - name: Get all file links
        env:
          MEGA_EMAIL: ${{ github.event.inputs.mega_email }}
          MEGA_PASSWORD: ${{ github.event.inputs.mega_password }}
          MEGA_FOLDER_LINK: ${{ github.event.inputs.mega_folder_link }}
        run: |
          echo "Logging in..."
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          
          echo "Importing folder..."
          mega-import "$MEGA_FOLDER_LINK" /incoming
          
          echo "Exporting all file links..."
          mega-export -a -r /incoming
          
          echo "All file links:"
          mega-export /incoming | grep "https://mega.nz" | awk '{for(i=1;i<=NF;i++) if($i~/https:/) print $i}' | sort -u > mega_links.txt
          
          cat mega_links.txt
          
          mega-logout || true
      
      - name: Upload links
        uses: actions/upload-artifact@v4
        with:
          name: mega-links
          path: mega_links.txt
