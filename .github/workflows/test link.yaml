name: List links from MEGA folder link

on:
  workflow_dispatch:
    inputs:
      mega_folder_link:
        description: 'Public MEGA folder link'
        required: true

jobs:
  list-mega-links:
    runs-on: ubuntu-latest

    steps:
      - name: Install Megatools
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: List all file links from folder link
        env:
          MEGA_FOLDER_LINK: ${{ github.event.inputs.mega_folder_link }}
        run: |
          echo "Folder: $MEGA_FOLDER_LINK"
          # `megatools ls -e` lists files and prints public download links.[web:17][web:19]
          megatools ls -R -e "$MEGA_FOLDER_LINK" | \
            awk '/https?:\/\/mega\.nz/ { print $NF }' | \
            sort -u | tee mega_links.txt

      - name: Upload links as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-links
          path: mega_links.txt
